# Cloud Run service configuration for jgames
# Configured for scale-to-zero (request-based billing)
# minScale: 0 means no always-on instances
# cpu-throttling: true means CPU is only active during requests
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: jgames
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: gcr.io/PROJECT_ID/jgames
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: MONGODB_URI
              value: REPLACE_MONGODB_URI
            - name: JWT_SECRET
              value: REPLACE_JWT_SECRET
            - name: PUBLIC_BASE_URL
              value: https://service-name-911352984870.europe-west1.run.app